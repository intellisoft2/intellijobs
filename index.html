<script>
/* IntelliJobs web app — runs on the hosted site (fetch → Apps Script JSON API) and inside
   Apps Script (google.script.run). No external libraries. All user text is escaped. */
'use strict';
const CONF = (typeof window !== 'undefined' && window.IJ_CONFIG) || {};
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (Number(n) || 0).toLocaleString('en-US');
const money = (n, cur) => (n === '' || n === null || n === undefined) ? '' : (cur && cur !== 'USD' ? cur + ' ' : '$') + num(Math.round(Number(n)));
const pct = n => (n === null || n === undefined || n === '') ? '—' : n + '%';
const day = s => s ? String(s).slice(0, 10) : '';
const when = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const ago = s => { if (!s) return ''; const d = (Date.now() - new Date(s)) / 86400000; return d < 1 ? 'today' : d < 2 ? 'yesterday' : Math.round(d) + 'd ago'; };
const list = v => String(v || '').split(/\s*,\s*/).filter(Boolean);
const parse = (s, d) => { if (s && typeof s === 'object') return s; try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };
const fitCls = n => (n >= 85 ? '' : n >= 70 ? 'mid' : n >= 50 ? 'low' : 'vlow');
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
};

const S = { token: store.get('ij-token'), pub: null, db: null, reports: null, billing: null, plat: null, cand: {}, modal: null,
  route: { name: '', parts: [], params: {} }, ui: { q: '', jobFilter: 'all', pipeJob: '', candQ: '', tab: {}, chat: [], interval: 'monthly', careers: null, task: null, sideOpen: false } };

/* ------------------------------------------------------------------ transport */
function rpc(fn, args) {
  const req = { fn: fn, args: args || [], token: S.token || '' };
  if (CONF.apiUrl) {
    return fetch(CONF.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' })
      .then(r => { if (!r.ok) throw new Error('The service is unreachable (HTTP ' + r.status + '). Please try again.'); return r.json(); });
  }
  if (GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
  return Promise.reject(new Error('IntelliJobs is not connected to its server. Ask the administrator to configure the API URL.'));
}

async function call(fn, ...args) {
  const r = await rpc(fn, args);
  if (r && r.ok) return r.data;
  const e = new Error((r && r.error) || 'Something went wrong.');
  e.code = r && r.code;
  if (e.code === 'AUTH' && S.token) { sessionEnded(e.message); }
  throw e;
}

/* ------------------------------------------------------------------ ui primitives */
let toastTimer = null;
function toast(msg, kind, ms) {
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, ms || 3800);
}
function fail(e) { toast(e && e.message ? e.message : String(e), 'error', 6500); }

function openModal(title, body, wide) { S.modal = { title: title, body: body, wide: !!wide }; paintModal(); }
function closeModal() { S.modal = null; paintModal(); }
function paintModal() {
  let m = $('modal-root');
  if (!m) { m = document.createElement('div'); m.id = 'modal-root'; document.body.appendChild(m); }

function readFile(file) {
  return new Promise((res, rej) => {
    if (!file) return res(null);
    if (file.size > 5 * 1024 * 1024) return rej(new Error('Files must be under 5 MB.'));
    const r = new FileReader();
    r.onload = () => res({ name: file.name, data: String(r.result).replace(/^data:[^,]*,/, '') });
    r.onerror = () => rej(new Error('Could not read the file.'));
    r.readAsDataURL(file);
  });
}

function download(name, text, mime) {
  const blob = text instanceof Blob ? text : new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

function copy(text) {
  const done = () => toast('Copied to clipboard', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => prompt('Copy this link:', text));
  else prompt('Copy this link:', text);
}

/** Form values: checkboxes → booleans, numbers left as strings for the server to validate. */
function formValues(form) {
  const out = {};
  Array.from(form.elements).forEach(el => {
    if (!el.name || el.disabled) return;
    if (el.type === 'checkbox') { if (el.dataset.multi) { (out[el.name] = out[el.name] || []); if (el.checked) out[el.name].push(el.value); } else out[el.name] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else if (el.type === 'file') { /* read separately */ }
    else out[el.name] = el.value;
  });
  return out;
}

function parseRoute() {
  const raw = decodeURIComponent(String(location.hash || '').replace(/^#\/?/, ''));
  const [path, query] = raw.split('?');
  const params = {};
  String(query || '').split('&').forEach(kv => { const p = kv.split('='); if (p[0]) params[p[0]] = (p[1] || '').replace(/\+/g, ' '); });
  if (/^t=/.test(path)) return { name: 'task', parts: [path.slice(2)], params: params };
  if (/^demo=/.test(path)) return { name: 'demo', parts: [path.slice(5)], params: params };
  const parts = path.split('/').filter(Boolean);
  return { name: (parts[0] || '').toLowerCase(), parts: parts.slice(1), params: params };
}

    setSession(res);
  } catch (e) { fail(e); setTimeout(() => go('#home'), 50); }
}

function paintTask() {
  const t = S.ui.task;
  const hi = 'Hi ' + esc(t.candidateName || 'there') + ',';
  if (t.kind === 'interview') {
    const done = ['Confirmed', 'Canceled', 'Completed'].indexOf(t.status) >= 0;
    return paint(taskShell('<div class="card"><h3>Your interview</h3><p>' + hi + '</p><p><b>' + esc(t.mode) + '</b><br>' + esc(when(t.startsAt)) + ' · ' + esc(t.durationMin) + ' minutes<br><span class="small muted">Shown in your time zone (' +

      '<p>Status: ' + statusChip(t.status) + '</p>' + (t.startsAt ? '<button class="btn secondary small" data-action="task-ics">Add to calendar (.ics)</button>' : '') +
      (t.hasScreening && !t.screeningDone ? screeningForm(t) : '') +
      (done ? '' : '<form data-form="task-interview" class="mt16">' + field('Note to the hiring team (optional)', area('note', '', 'rows="2" placeholder="Accessibility needs, preferred times…"')) +
        '<div class="row mt16"><button class="btn" type="submit" name="action" value="confirm" data-submit="confirm">Confirm attendance</button><button class="btn secondary" type="submit" data-submit="reschedule">Request a different time</button></div></form>') + '</div>'));
  }
  if (t.kind === 'screening') {
    if (t.screeningDone || t.status === 'Completed') return paint(taskShell('<div class="card"><h3>Thank you!</h3><p>Your screening answers were received. The hiring team will be in touch.</p></div>'));
    return paint(taskShell('<div class="card"><h3>Written screening</h3><p>' + hi + '</p><p class="muted">Answer in your own words with specific examples. Take your time — there is no timer. AI helps organize your answers for the hiring team; a person reviews every response and makes every decision. Need an accommodation? Reply to the invitation email.</p>' + screeningForm(t) + '</div>'));
  }
  if (t.kind === 'assessment') return paintAssessment();
  if (t.kind === 'verification') {
    if (t.status !== 'Awaiting consent') return paint(taskShell('<div class="card"><h3>Response recorded</h3><p>Status: ' + statusChip(t.status) + '</p><p class="muted small">Questions or a dispute? Reply to the email you received from the hiring team.</p></div>'));
    return paint(taskShell('<div class="card"><h3>Disclosure regarding background checks</h3><p>' + hi + '</p>' +
      '<p>' + esc(t.org.name) + ' may obtain information about you from a third-party consumer reporting agency for employment purposes, as part of your application for ' + esc(t.jobTitle) + '. The checks requested are:</p><div>' + chips(t.checks, 'a') + '</div>' +
      '<p class="mt16">The report will be prepared by ' + esc(t.provider) + '. You have rights under the federal Fair Credit Reporting Act, including the right to request a copy of any report, to dispute inaccurate or incomplete information, and to receive notice before any adverse decision. A summary of your rights is available from the Consumer Financial Protection Bureau (consumerfinance.gov). State or local laws may give you additional rights.</p>' +
      '<div class="notice small">This disclosure is shown on its own, separate from your application. Nothing is requested unless you authorize it below.</div>' +
      '<form data-form="task-verify"><h4 class="mt16">Authorization</h4><label class="check"><input type="checkbox" name="consent" required> <span>I have read the disclosure and authorize ' + esc(t.org.name) + ' to obtain the checks listed above for employment purposes.</span></label>' +
      field('Type your full legal name as your electronic signature', inp('fullName', '', 'required autocomplete="name"')) +
      '<div class="row mt16"><button class="btn" type="submit">Authorize</button><button class="btn danger" type="button" data-action="task-decline-verify">I do not authorize</button></div></form></div>'));
  }
  if (t.kind === 'offer') {
    if (t.status !== 'Sent') return paint(taskShell('<div class="card"><h3>Offer ' + esc(String(t.status).toLowerCase()) + '</h3><p class="muted">Thank you. The hiring team has your response.</p></div>'));
    return paint(taskShell('<div class="card"><h3>Your offer 🎉</h3><p>' + hi + '</p><p>We are delighted to offer you the position of <b>' + esc(t.jobTitle) + '</b>.</p><div class="grid g2"><div class="card flat tight"><span class="small muted">Compensation</span><div style="font-size:22px;font-weight:800">' +
      money(t.salary, t.currency) + '</div></div><div class="card flat tight"><span class="small muted">Start date</span><div style="font-size:22px;font-weight:800">' + esc(t.startDate) + '</div></div></div>' +
      (t.terms ? '<p class="mt16" style="white-space:pre-wrap">' + esc(t.terms) + '</p>' : '') + '<form data-form="task-offer" class="mt16">' + field('Type your full legal name to accept', inp('fullName', '', 'required autocomplete="name"')) +
      '<div class="row mt16"><button class="btn" type="submit">Accept offer</button><button class="btn danger" type="button" data-action="task-decline-offer">Decline</button></div></form></div>'));
  }
}

function screeningForm(t) {
  return '<form data-form="task-screening" class="mt16">' + (t.questions || []).map((q, i) => '<div class="q"><b>' + (i + 1) + '. ' + esc(q) + '</b>' + area('a' + i, '', 'rows="4" aria-label="Answer ' + (i + 1) + '"') + '</div>').join('') +
    '<button class="btn" type="submit">Submit answers</button></form>';
}

function paintAssessment() {
  const t = S.ui.task, x = S.ui.test;
  if (t.status === 'Completed' && !x) return paint(taskShell('<div class="card"><h3>Assessment complete</h3><p>Thank you — your results were shared with the hiring team.</p></div>'));
  if (x && x.result) return paint(taskShell('<div class="card"><h3>Submitted ✓</h3><p>You answered ' + x.result.correct + ' of ' + x.result.total + ' correctly (' + x.result.score + '%).</p>' +
    (x.result.late ? '<div class="notice warn">Submitted after the time limit.</div>' : '') + '<p class="muted">The hiring team will review your result together with the rest of your application.</p></div>'));
  if (!x) return paint(taskShell('<div class="card"><h3>' + esc(t.title) + '</h3><p>Hi ' + esc(t.candidateName) + ',</p><p>' + t.questionCount + ' multiple-choice questions · ' + t.durationMin + ' minutes · pass mark ' + t.passMark + '%.</p>' +
    '<div class="notice small">The timer starts when you press Start and keeps running if you close the page. Use your own knowledge; you may not need every minute. If you need extra time or a different format as an accommodation, contact the hiring team before starting.</div>' +
    '<button class="btn" data-action="task-start-test">Start assessment</button></div>'));
  paint(taskShell('<div class="timer" id="timer">Time left: …</div><form data-form="task-test" class="mt16">' + x.questions.map((q, i) => '<div class="q"><b>' + (i + 1) + '. ' + esc(q.q) + '</b>' +
    q.options.map((o, oi) => '<label class="opt"><input type="radio" name="q' + i + '" value="' + oi + '"> <span>' + esc(o) + '</span></label>').join('') + '</div>').join('') +
    '<button class="btn" type="submit">Submit answers</button></form>'));
  tickTimer();
}
let timerHandle = null;
function tickTimer() {
  clearInterval(timerHandle);
  const x = S.ui.test; if (!x || x.result) return;
  const upd = () => {
    const el = $('timer'); if (!el) return clearInterval(timerHandle);
    const left = Math.max(0, Math.round((new Date(x.deadline) - Date.now()) / 1000));
    el.textContent = 'Time left: ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) { clearInterval(timerHandle); el.textContent = 'Time is up — submitting…'; const f = document.querySelector('form[data-form="task-test"]'); if (f) FORMS['task-test'](formValues(f), f); }
  };
  upd(); timerHandle = setInterval(upd, 1000);
}

function icsText(title, startIso, minutes, location, desc) {
  const f = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = new Date(new Date(startIso).getTime() + (Number(minutes) || 45) * 60000);
  const e = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Intellisoft//IntelliJobs//EN', 'BEGIN:VEVENT', 'UID:' + Date.now() + '@intellijobs', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(startIso), 'DTEND:' + f(end),
    'SUMMARY:' + e(title), 'DESCRIPTION:' + e(desc), 'LOCATION:' + e(location || ''), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

const NAV = [
  ['Hiring', [['dashboard', '◉', 'Dashboard'], ['jobs', '▤', 'Jobs'], ['pipeline', '▦', 'Pipeline'], ['candidates', '☺', 'Candidates'], ['interviews', '🎙', 'Interviews']]],
  ['Validate', [['assessments', '⌘', 'Assessments', 'assessments'], ['verification', '🛡', 'Verification', 'verification'], ['offers', '✉', 'Offers', 'offers']]],
  ['Grow & insight', [['growth', '↗', 'Skill growth', 'growth'], ['copilot', '✦', 'AI copilot', 'ai'], ['reports', '▥', 'Reports']]],
  ['Admin', [['careers-site', '◇', 'Careers site'], ['team', '👥', 'Team'], ['billing', '$', 'Billing'], ['audit', '≣', 'Audit log']]]
];

function renderApp() {
  const page = S.route.parts[0] || 'dashboard';
  const db = S.db, org = db.org;
  const counts = {
    jobs: db.jobs.filter(j => j.status === 'Open').length, candidates: db.candidates.length,
    interviews: db.interviews.filter(i => ['Scheduled', 'Confirmed', 'Reschedule requested'].indexOf(i.status) >= 0 && (!i.startsAt || i.startsAt >= new Date().toISOString())).length,
    verification: db.verifications.filter(v => ['Awaiting consent', 'Consent given', 'In progress'].indexOf(v.status) >= 0).length,
    offers: db.offers.filter(o => ['Pending Approval', 'Approved', 'Sent'].indexOf(o.status) >= 0).length
  };
  const st = org.standing || {};
  const banner = org.demo ? '<div class="banner demo">Sandbox demo · private to you · resets within 24 hours · candidate emails are simulated. <a href="#register">Start a free trial</a> to keep your work.</div>'
    : st.expired || !st.writable ? '<div class="banner bad">' + esc(st.reason) + ' <a href="#app/billing">Choose a plan</a></div>'
    : st.trial ? '<div class="banner">Free trial · ' + st.daysLeft + ' day' + (st.daysLeft === 1 ? '' : 's') + ' left on ' + esc(org.planName) + '. <a href="#app/billing">Choose a plan</a></div>'
    : st.pastDue ? '<div class="banner bad">' + esc(st.reason) + ' <a href="#app/billing">Update payment</a></div>' : '';
  const nav = NAV.map(g => '<div class="nav-group">' + g[0] + '</div><nav class="nav">' + g[1].map(n => {
    const locked = n[3] && !hasFeat(n[3]);
    return '<a href="#app/' + n[0] + '" class="' + (page === n[0] || (page === 'job' && n[0] === 'jobs') || (page === 'candidate' && n[0] === 'candidates') ? 'on' : '') + (locked ? ' locked' : '') + '"><span>' + n[1] + '</span>' + n[2] +
      (locked ? '<span class="count">🔒</span>' : counts[n[0]] ? '<span class="count">' + counts[n[0]] + '</span>' : '') + '</a>';
  }).join('') + '</nav>').join('') + (db.platformAdmin ? '<div class="nav-group">Intellisoft</div><nav class="nav"><a href="#app/platform" class="' + (page === 'platform' ? 'on' : '') + '"><span>⚑</span>Platform console</a></nav>' : '');
  const orgSwitch = db.myOrgs.length > 1 ? '<select data-change="switch-org" style="max-width:220px">' + db.myOrgs.map(o => opt(o.id, org.id, o.name)).join('') + '</select>' : '<b>' + esc(org.name) + '</b>';
  let body = '';
  try { body = (PAGES[page] || PAGES.dashboard)(); } catch (e) { body = '<div class="notice bad">' + esc(e.message) + '</div>'; console.error(e); }
  paint('<div class="shell"><aside class="side ' + (S.ui.sideOpen ? 'open' : '') + '">' + logo() + nav + '<div class="small dim" style="padding:16px 10px">v' + esc(db.version) + '</div></aside>' +
    '<div class="main">' + banner + '<div class="top"><button class="btn ghost small mobile-only" data-action="toggle-side" aria-label="Menu">☰</button>' + orgSwitch + chip(org.planName + (org.status === 'Trialing' ? ' trial' : ''), 'a') +
    '<span class="grow"></span>' + (org.slug ? '<a class="btn ghost small" href="#careers/' + esc(org.slug) + '" target="_blank" rel="noopener">Careers page ↗</a>' : '') +
    '<span class="small muted">' + esc(db.who.name || db.who.email) + ' · ' + lbl(db.who.role) + '</span><button class="btn ghost small" data-action="account">Account</button><button class="btn ghost small" data-action="logout">Sign out</button></div>' +
    '<div class="page">' + body + '</div></div></div>');
  afterPaint(page);
}

function afterPaint(page) {
  if (page === 'reports' && !S.reports) call('getReports').then(r => { S.reports = r; if ((S.route.parts[0] || '') === 'reports') renderApp(); }, fail);
  if (page === 'billing' && !S.billing) loadBilling();
  if (page === 'platform' && !S.plat) loadPlatform();
  if (page === 'audit' && !S.audit) call('getAuditLogs').then(r => { S.audit = r; if (S.route.parts[0] === 'audit') renderApp(); }, e => { S.audit = []; fail(e); });
  if (page === 'candidate') { const id = S.route.parts[1]; if (id && !S.cand[id]) call('getCandidate', id).then(r => { S.cand[id] = r; if (S.route.parts[1] === id) renderApp(); }, fail); }
  const f = S.ui.refocus; if (f) { const el = $(f); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not text */ } } S.ui.refocus = null; }
}

PAGES.candidate = () => {
  const id = S.route.parts[1], d = S.cand[id], c0 = candById(id);
  if (!d) return '<a href="#app/candidates" class="small">← Candidates</a>' + head(esc(c0.name || 'Candidate')) + '<div class="loading">Loading profile<span class="pulse"></span></div>';
  const c = d.candidate, tab = S.ui.tab[id] || 'apps';
  const acts = can('RECRUITER') ? ['<button class="btn" data-action="add-to-job" data-id="' + c.id + '">Add to job</button>', '<button class="btn secondary" data-action="schedule" data-cand="' + c.id + '">Schedule interview</button>',
    hasFeat('assessments') ? '<button class="btn secondary" data-action="send-test" data-cand="' + c.id + '">Send assessment</button>' : '', '<button class="btn secondary" data-action="message" data-id="' + c.id + '">Email</button>',
    '<button class="btn ghost" data-action="edit-cand" data-id="' + c.id + '">Edit</button>'].join('') : '';
  const tabs = [['apps', 'Applications & fit'], ['interviews', 'Interviews (' + d.interviews.length + ')'], ['validate', 'Assessments & checks'], ['offers', 'Offers'], ['growth', 'Growth'], ['notes', 'Notes (' + d.notes.length + ')'], ['resume', 'Resume']];
  return '<a href="#app/candidates" class="small">← Candidates</a>' + head(esc(c.name) + ' ' + (c.status !== 'Active' ? statusChip(c.status) : ''), [c.headline, c.location, c.yearsExp ? c.yearsExp + ' yrs' : '', c.email, c.phone].filter(Boolean).map(esc).join(' · ') +
    (c.linkedin ? ' · <a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' : ''), acts) +
    '<div>' + chips(list(c.skills)) + chips(d.verified.map(s => '✓ ' + s + ' verified'), 'ok') + (c.tags ? chips(list(c.tags), 'info') : '') + '</div>' +
    '<div class="tabs mt16">' + tabs.map(t => '<button class="' + (tab === t[0] ? 'on' : '') + '" data-action="cand-tab" data-id="' + c.id + '" data-v="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' + (CAND_TABS[tab] || CAND_TABS.apps)(d);
};

function evidenceRows(fit) {
  return (fit.required || []).map(r => '<div class="ev"><span>' + (r.verified ? '✅' : r.found ? '✓' : '✗') + '</span><b>' + esc(r.skill) + '</b><span class="dim">' + (r.verified ? 'Verified by assessment. ' : '') + esc(r.evidence || (r.found ? 'Mentioned in profile' : 'No evidence yet — verify in interview or assessment')) + '</span></div>').join('') +
    (fit.preferred || []).map(r => '<div class="ev"><span>' + (r.found || r.verified ? '✓' : '·') + '</span><span>' + esc(r.skill) + ' <span class="tiny dim">preferred</span></span><span class="dim">' + esc(r.evidence || '') + '</span></div>').join('');
}

const CAND_TABS = {
  apps: d => d.applications.length ? d.applications.map(a => {
    const f = a.fit || {};
    return '<div class="card mt16"><div class="row between wrap-row"><div><h3 class="mb0">' + esc(a.jobTitle) + '</h3><div class="small muted">Applied ' + day(a.createdAt) + ' · ' + esc(a.source) + (a.rejectReason ? ' · Reason: ' + esc(a.rejectReason) : '') + '</div></div>' +
      '<div class="row">' + (can('INTERVIEWER') ? '<select data-change="rate" data-id="' + a.id + '" aria-label="Rating">' + opts([['', 'Rate…'], [1, '★'], [2, '★★'], [3, '★★★'], [4, '★★★★'], [5, '★★★★★']], a.rating) + '</select>' : '') +
      (can('RECRUITER') ? '<select data-change="stage" data-id="' + a.id + '">' + opts(S.db.lists.stages, a.stage) + '</select>' : stageChip(a.stage)) + '</div></div>' +
      '<div class="grid g2 mt16" style="grid-template-columns:.9fr 1.1fr"><div>' + fitView(f, null, false) + '</div><div class="card flat"><h4>Evidence by requirement</h4>' + evidenceRows(f) + '</div></div>' +
      (parse(a.answers, []).filter(x => x.a).length ? '<details class="mt8"><summary class="small">Application answers</summary>' + parse(a.answers, []).map(x => '<p class="small"><b>' + esc(x.q) + '</b><br>' + esc(x.a) + '</p>').join('') + '</details>' : '') +
      (a.coverNote ? '<details class="mt8"><summary class="small">Cover note</summary><p class="small" style="white-space:pre-wrap">' + esc(a.coverNote) + '</p></details>' : '') +
      (can('RECRUITER') ? '<div class="row wrap-row mt16"><button class="btn small secondary" data-action="schedule" data-app="' + a.id + '">Schedule interview</button>' +
        (hasFeat('assessments') ? '<button class="btn small secondary" data-action="send-test" data-app="' + a.id + '">Send assessment</button>' : '') +
        (hasFeat('verification') ? '<button class="btn small secondary" data-action="verify" data-app="' + a.id + '">Request verification</button>' : '') +
        (hasFeat('offers') ? '<button class="btn small secondary" data-action="new-offer" data-app="' + a.id + '">Create offer</button>' : '') +
        (hasFeat('growth') ? '<button class="btn small ghost" data-action="new-plan" data-cand="' + a.candidateId + '" data-job="' + a.jobId + '">Growth plan</button>' : '') + '</div>' : '') + '</div>';
  }).join('') : '<div class="empty">In the talent pool — not attached to a job. ' + (can('RECRUITER') ? '<a href="#app/candidates" data-action="add-to-job" data-id="' + d.candidate.id + '">Add to a job</a>' : '') + '</div>',
  interviews: d => d.interviews.length ? d.interviews.slice().reverse().map(i => interviewCard(i, d.scorecards.filter(s => s.interviewId === i.id))).join('') : '<div class="empty">No interviews yet.</div>',
  validate: d => '<h4>Assessments</h4>' + (d.invites.length ? '<div class="table-wrap"><table><tr><th>Assessment</th><th>Status</th><th>Score</th><th>Completed</th></tr>' + d.invites.map(i => {
    const t = S.db.assessments.find(x => x.id === i.assessmentId) || {};
    return '<tr><td>' + esc(t.title) + '<div class="small muted">' + esc(t.skill) + ' · pass ' + t.passMark + '%</div></td><td>' + statusChip(i.status) + '</td><td>' + (i.status === 'Completed' ? '<b>' + i.score + '%</b> ' + (i.passed === 'Yes' ? chip('Passed', 'ok') : chip('Below pass mark', 'warn')) : '—') + '</td><td class="small">' + day(i.completedAt) + '</td></tr>';
  }).join('') + '</table></div>' : '<p class="muted small">None sent.</p>') +
    '<h4 class="mt24">Verification</h4>' + (d.verifications.length ? d.verifications.map(verificationCard).join('') : '<p class="muted small">No checks requested.</p>'),
  offers: d => d.offers.length ? d.offers.map(o => offerRow(o)).join('') : '<div class="empty">No offers.</div>',
  growth: d => (d.plans.length ? d.plans.map(p => planCardView(p)).join('') : '<div class="empty">No growth plans yet.</div>'),
  notes: d => (can('INTERVIEWER') ? '<form data-form="note" class="card flat tight"><input type="hidden" name="candidateId" value="' + d.candidate.id + '">' + area('body', '', 'rows="2" placeholder="Add a note for the hiring team…" required') + '<button class="btn small mt8">Add note</button></form>' : '') +
    d.notes.map(n => '<div class="card flat tight mt8"><div class="small muted">' + esc(n.author) + ' · ' + when(n.createdAt) + '</div><div style="white-space:pre-wrap">' + esc(n.body) + '</div></div>').join('') +
    (d.messages.length ? '<h4 class="mt24">Emails</h4>' + d.messages.map(m => '<div class="card flat tight mt8"><div class="small muted">' + esc(m.author) + ' · ' + when(m.createdAt) + ' · ' + esc(m.status) + '</div><b>' + esc(m.subject) + '</b><div class="small" style="white-space:pre-wrap">' + esc(m.body) + '</div></div>').join('') : ''),
  resume: d => '<div class="card"><div class="row between"><h3 class="mb0">Resume</h3>' + (d.candidate.resumeFileId ? '<button class="btn small secondary" data-action="dl-resume" data-id="' + d.candidate.id + '">Download original (' + esc(d.candidate.resumeName) + ')</button>' : '') + '</div>' +
    '<pre style="white-space:pre-wrap;font-family:inherit;font-size:13.5px" class="mt16">' + esc(d.candidate.resumeText || 'No resume on file.') + '</pre></div>' +
    '<p class="small muted mt16">Consent recorded: ' + (d.candidate.consentAt ? day(d.candidate.consentAt) : 'not via careers page') + (d.candidate.workAuthorization ? ' · Work authorization: ' + esc(d.candidate.workAuthorization) : '') + '</p>' +
    (can('ADMIN') ? '<button class="btn danger small" data-action="erase-cand" data-id="' + d.candidate.id + '">Erase candidate (right to erasure)</button>' : '')
};
/* ------------------------------------------------------------------ interviews */
function interviewCard(i, cards) {
  const c = candById(i.candidateId), j = jobById(i.jobId), qa = parse(i.responses, []);
  const mine = cards.find(s => s.interviewer === S.db.who.email);
  return '<div class="card mt16"><div class="row between wrap-row"><div><h3 class="mb0">' + esc(i.mode) + ' ' + statusChip(i.status) + '</h3><div class="small muted">' + esc(c.name) + ' · ' + esc(j.title) +
    (i.startsAt ? ' · ' + esc(when(i.startsAt)) + ' · ' + i.durationMin + ' min' : ' · candidate answers any time') + (i.interviewers ? ' · Panel: ' + esc(i.interviewers) : '') + '</div>' +
    (i.meetingLink ? '<a class="small" href="' + esc(i.meetingLink) + '" target="_blank" rel="noopener">' + esc(i.meetingLink) + '</a>' : '') + '</div><div class="row wrap-row">' +
    (can('RECRUITER') && ['Scheduled', 'Confirmed', 'Reschedule requested'].indexOf(i.status) >= 0 ? '<button class="btn small ghost" data-action="iv-link" data-id="' + i.id + '">New candidate link</button>' +
      (i.startsAt ? '<button class="btn small ghost" data-action="iv-ics" data-id="' + i.id + '">.ics</button><button class="btn small secondary" data-action="iv-resched" data-id="' + i.id + '">Reschedule</button>' : '') +
      '<select data-change="iv-status" data-id="' + i.id + '" aria-label="Interview status">' + opts([['', 'Set status…'], 'Completed', 'No-show', 'Canceled'], '') + '</select>' : '') +
    (can('INTERVIEWER') && i.mode !== 'AI-assisted screening' ? '<button class="btn small" data-action="scorecard" data-id="' + i.id + '">' + (mine ? 'Edit my scorecard' : 'Submit scorecard') + '</button>' : '') +
    (hasFeat('ai') && (cards.length || i.responses) ? '<button class="btn small secondary" data-action="iv-summary" data-id="' + i.id + '">✦ Summarize</button>' : '') + '</div></div>' +
    (i.aiSummary ? '<div class="notice small mt8" style="white-space:pre-wrap"><b>Screening summary (for human review)</b>\n' + esc(i.aiSummary) + '</div>' : '') +
    (qa.length ? '<details class="mt8"><summary class="small">Candidate answers (' + qa.length + ')</summary>' + qa.map(x => '<p class="small"><b>' + esc(x.q) + '</b><br>' + esc(x.a || '—') + '</p>').join('') + '</details>' : '') +
    (cards.length ? '<div class="table-wrap mt8"><table><tr><th>Interviewer</th><th>Overall</th><th>Recommendation</th><th>Competencies</th><th>Notes</th></tr>' + cards.map(s => '<tr><td class="small">' + esc(s.interviewer) + '</td><td><b>' + s.overall + '/5</b></td><td>' +
      chip(s.recommendation, /yes/i.test(s.recommendation) ? 'ok' : 'bad') + '</td><td class="small">' + Object.entries(parse(s.ratings, {})).map(e => esc(e[0]) + ' ' + e[1]).join(' · ') + '</td><td class="small">' + esc(s.notes) + '</td></tr>').join('') + '</table></div>' : '') +
    '<div id="sum-' + i.id + '"></div></div>';
}

PAGES.interviews = () => {
  const now = new Date().toISOString(), all = S.db.interviews;
  const upcoming = all.filter(i => ['Scheduled', 'Confirmed', 'Reschedule requested'].indexOf(i.status) >= 0 && (!i.startsAt || i.startsAt >= now)).sort((a, b) => String(a.startsAt || 'z').localeCompare(String(b.startsAt || 'z')));
  const needCards = all.filter(i => i.mode !== 'AI-assisted screening' && i.startsAt && i.startsAt < now && ['Scheduled', 'Confirmed', 'Completed'].indexOf(i.status) >= 0 && !S.db.scorecards.some(s => s.interviewId === i.id));
  const recent = all.filter(i => upcoming.indexOf(i) < 0).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 12);
  const sc = id => S.db.scorecards.filter(s => s.interviewId === id);
  return head('Interviews', 'AI-assisted screening, human panels, calendar invites and structured scorecards', can('RECRUITER') ? '<button class="btn" data-action="schedule">+ Schedule</button>' : '') +
    '<div class="notice small">AI-assisted screening gives candidates structured, job-related written questions they can answer 24/7, with an upfront disclosure and an accommodation path. A person reviews every answer. Live audio/video calls use your own meeting links (Teams, Zoom, Meet).</div>' +
    (needCards.length ? '<h3 class="mt24">Scorecards needed (' + needCards.length + ')</h3>' + needCards.map(i => interviewCard(i, sc(i.id))).join('') : '') +
    '<h3 class="mt24">Upcoming & awaiting response (' + upcoming.length + ')</h3>' + (upcoming.length ? upcoming.map(i => interviewCard(i, sc(i.id))).join('') : '<div class="empty">Nothing scheduled.</div>') +
    '<h3 class="mt24">Recent</h3>' + (recent.length ? recent.filter(i => needCards.indexOf(i) < 0).map(i => interviewCard(i, sc(i.id))).join('') : '<p class="muted">—</p>');
};

/* ------------------------------------------------------------------ assessments */
PAGES.assessments = () => {
  if (!hasFeat('assessments')) return locked('assessments', 'Assessments');
  const tests = S.db.assessments;
  return head('Assessments', 'Timed, auto-scored skill checks — passing adds verified evidence to job fit', can('RECRUITER') ? '<button class="btn" data-action="new-test">+ New assessment</button>' : '') +
    (tests.length ? '<div class="grid g3">' + tests.map(t => {
      const inv = S.db.invites.filter(i => i.assessmentId === t.id), done = inv.filter(i => i.status === 'Completed');
      return '<div class="card"><div class="row between"><h3 class="mb0">' + esc(t.title) + '</h3>' + statusChip(t.status) + '</div><div class="small muted">' + esc(t.skill) + ' · ' + esc(t.level) + ' · ' + parse(t.questions, []).length + ' questions · ' + t.durationMin + ' min · pass ' + t.passMark + '%</div>' +
        '<div class="grid g3 mt16"><div><b>' + inv.length + '</b><div class="tiny dim">invited</div></div><div><b>' + done.length + '</b><div class="tiny dim">completed</div></div><div><b>' + (done.length ? Math.round(done.filter(i => i.passed === 'Yes').length / done.length * 100) + '%' : '—') + '</b><div class="tiny dim">pass rate</div></div></div>' +
        (can('RECRUITER') ? '<div class="row mt16"><button class="btn small" data-action="send-test" data-test="' + t.id + '">Invite candidate</button><button class="btn small ghost" data-action="test-archive" data-id="' + t.id + '" data-v="' + (t.status === 'Active' ? 'Archived' : 'Active') + '">' + (t.status === 'Active' ? 'Archive' : 'Restore') + '</button></div>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="empty">No assessments yet. Generate one from the built-in banks (AWS, Python, SQL, Kubernetes, Terraform, Java, React, Security, ML, LLM, Docker) or write your own.</div>') +
    (S.db.invites.length ? '<h3 class="mt24">Results</h3><div class="table-wrap"><table><tr><th>Candidate</th><th>Assessment</th><th>Status</th><th>Score</th><th>When</th></tr>' + S.db.invites.slice().reverse().map(i => {
      const t = tests.find(x => x.id === i.assessmentId) || {};
      return '<tr class="click" data-action="open-cand" data-id="' + i.candidateId + '"><td><b>' + esc(candById(i.candidateId).name) + '</b></td><td>' + esc(t.title) + '</td><td>' + statusChip(i.status) + '</td><td>' + (i.status === 'Completed' ? i.score + '% ' + (i.passed === 'Yes' ? chip('Passed', 'ok') : chip('Below', 'warn')) : '—') + '</td><td class="small muted">' + ago(i.completedAt || i.createdAt) + '</td></tr>';
    }).join('') + '</table></div>' : '');
};

function testEditor(qs) {
  return (qs || []).map((q, i) => '<div class="q" data-q="' + i + '"><div class="row between"><b>Question ' + (i + 1) + '</b><button class="btn ghost small" type="button" data-action="q-del" data-i="' + i + '">Remove</button></div>' +
    area('q' + i, q.q, 'rows="2" required') + q.options.map((o, oi) => '<div class="row mt8"><input type="radio" name="a' + i + '" value="' + oi + '"' + (q.answer === oi ? ' checked' : '') + ' aria-label="Correct answer">' +
      inp('o' + i + '_' + oi, o, 'type="text" required') + '</div>').join('') + '</div>').join('');
}

/* ------------------------------------------------------------------ verification */
function verificationCard(v) {
  const steps = [['01 · Disclose', 'Request & disclosure sent', true], ['02 · Authorize', v.consentAt ? 'E-signed by ' + v.consentName + ' · ' + day(v.consentAt) : v.status === 'Consent declined' ? 'Declined' : 'Awaiting candidate', !!v.consentAt],
    ['03 · Verify', v.providerRef ? 'Provider ref ' + v.providerRef : v.status === 'In progress' ? 'With provider' : '—', ['In progress', 'Completed', 'Pre-adverse notice sent', 'Adverse action sent'].indexOf(v.status) >= 0],
    ['04 · Review', v.result ? 'Result: ' + v.result : '—', !!v.result], ['05 · Resolve', v.adverseAt ? 'Adverse action ' + day(v.adverseAt) : v.preAdverseAt ? 'Pre-adverse ' + day(v.preAdverseAt) : v.result === 'Clear' ? 'Cleared' : '—', !!v.adverseAt || v.result === 'Clear']];
  return '<div class="card mt16"><div class="row between wrap-row"><div><b>' + esc(candById(v.candidateId).name) + '</b> · ' + esc(jobById(appById(v.applicationId).jobId).title) + ' ' + statusChip(v.status) + '<div class="small muted">' + esc(v.checks) + ' · ' + esc(v.provider) + '</div></div><div class="row wrap-row">' +
    (can('RECRUITER') && v.status === 'Consent given' ? '<button class="btn small" data-action="ver-update" data-id="' + v.id + '" data-v="In progress">Mark sent to provider</button>' : '') +
    (can('RECRUITER') && ['In progress', 'Consent given'].indexOf(v.status) >= 0 ? '<button class="btn small secondary" data-action="ver-result" data-id="' + v.id + '">Record result</button>' : '') +
    (can('HIRING_MANAGER') && v.result === 'Consider' && !v.preAdverseAt && v.status !== 'Disputed' ? '<button class="btn small danger" data-action="pre-adverse" data-id="' + v.id + '">Send pre-adverse notice</button>' : '') +
    (can('HIRING_MANAGER') && v.preAdverseAt && !v.adverseAt ? '<button class="btn small danger" data-action="adverse" data-id="' + v.id + '">Final adverse action</button><button class="btn small ghost" data-action="ver-update" data-id="' + v.id + '" data-v="Disputed">Mark disputed</button>' : '') +
    (can('RECRUITER') && ['Awaiting consent', 'Consent given', 'In progress'].indexOf(v.status) >= 0 ? '<button class="btn small ghost" data-action="ver-update" data-id="' + v.id + '" data-v="Canceled">Cancel</button>' : '') + '</div></div>' +
    '<div class="timeline mt16">' + steps.map((s, i) => '<div class="step ' + (s[2] ? 'done' : '') + '"><b>' + s[0] + '</b>' + esc(s[1]) + '</div>').join('') + '</div>' + (v.notes ? '<p class="small muted mt8" style="white-space:pre-wrap">' + esc(v.notes) + '</p>' : '') + '</div>';
}

PAGES.verification = () => {
  if (!hasFeat('verification')) return locked('verification', 'Verification');
  const v = S.db.verifications.slice().reverse();
  return head('Verification hub', 'Candidate-first background, identity and credential verification workflow') +
    '<div class="notice small">IntelliJobs manages disclosure, written authorization, provider tracking and adverse-action notices; checks are performed by your authorized screening provider. Employment background checks must follow the FCRA and applicable state/local (including fair-chance) laws — review notice templates with counsel. Never use protected characteristics in decisions.</div>' +
    (v.length ? v.map(verificationCard).join('') : '<div class="empty">No verification requests. Start one from a candidate\'s application.</div>');
};

/* ------------------------------------------------------------------ offers */
function offerRow(o) {
  return '<div class="card mt16"><div class="row between wrap-row"><div><b>' + esc(candById(o.candidateId).name) + '</b> · ' + esc(jobById(o.jobId).title) + ' ' + statusChip(o.status) +
    '<div class="small muted">' + money(o.salary, o.currency) + ' · start ' + esc(o.startDate) + (o.approver ? ' · approved by ' + esc(o.approver) : '') + ' · created by ' + esc(o.createdBy) + '</div></div><div class="row wrap-row">' +
    (can('HIRING_MANAGER') && o.status === 'Pending Approval' ? '<button class="btn small" data-action="offer-decide" data-id="' + o.id + '" data-v="1">Approve</button><button class="btn small secondary" data-action="offer-decide" data-id="' + o.id + '" data-v="0">Return</button>' : '') +
    (can('RECRUITER') && (o.status === 'Approved' || o.status === 'Sent') ? '<button class="btn small" data-action="offer-send" data-id="' + o.id + '">' + (o.status === 'Sent' ? 'Resend / new link' : 'Send to candidate') + '</button>' : '') +
    (can('HIRING_MANAGER') && ['Draft', 'Pending Approval', 'Approved', 'Sent'].indexOf(o.status) >= 0 ? '<button class="btn small ghost" data-action="offer-withdraw" data-id="' + o.id + '">Withdraw</button>' : '') + '</div></div>' +
    (o.terms ? '<p class="small" style="white-space:pre-wrap">' + esc(o.terms) + '</p>' : '') + '</div>';
}
PAGES.offers = () => {
  if (!hasFeat('offers')) return locked('offers', 'Offers');
  const o = S.db.offers.slice().reverse();
  return head('Offers', 'Approvals by hiring managers, e-acceptance by candidates') + (o.length ? o.map(offerRow).join('') : '<div class="empty">No offers yet. Create one from an application in the Offer stage.</div>');
};

/* ------------------------------------------------------------------ growth */
function planCardView(p) {
  const plan = parse(p.plan, []);
  return '<div class="card mt16"><div class="row between"><div><b>' + esc(candById(p.candidateId).name) + '</b> → ' + esc(jobById(p.jobId).title) + ' ' + statusChip(p.status) + '<div class="small muted">Gaps: ' + (parse(p.gaps, []).map(esc).join(', ') || 'none') + '</div></div>' +
    (can('RECRUITER') && p.status === 'Active' ? '<button class="btn small ghost" data-action="plan-done" data-id="' + p.id + '">Mark completed</button>' : '') + '</div><div class="grid g3 mt8">' +
    plan.map(w => '<div class="card flat tight"><b class="small" style="color:var(--a)">Week ' + w.week + ' · ' + esc(w.focus) + '</b><ul class="small" style="padding-left:18px;margin:6px 0">' + w.items.map(i => '<li>' + linkify(i) + '</li>').join('') + '</ul></div>').join('') + '</div></div>';
}
PAGES.growth = () => {
  if (!hasFeat('growth')) return locked('growth', 'Skill growth');
  const gaps = {};
  S.db.applications.filter(a => S.db.lists.activeStages.indexOf(a.stage) >= 0).forEach(a => (parse(a.fitDetail, {}).missing || []).forEach(s => { gaps[s] = (gaps[s] || 0) + 1; }));
  const top = Object.entries(gaps).sort((a, b) => b[1] - a[1]).slice(0, 10), max = top.length ? top[0][1] : 1;
  return head('Skill growth', 'Gap-to-goal plans: microlearning, labs, mentorship and reassessment', can('RECRUITER') ? '<button class="btn" data-action="new-plan">+ Growth plan</button>' : '') +
    '<div class="grid g2"><div class="card"><h3>Most common gaps in active pipelines</h3>' + (top.length ? top.map(g => '<div class="funnel-row"><span>' + esc(g[0]) + '</span>' + bar(g[1], max) + '<span class="small muted">' + g[1] + '</span></div>').join('') : '<p class="muted">No gaps detected.</p>') +

function inclusiveHtml(flags, score) {
  if (!flags) return '';
  if (!flags.length) return '<div class="notice small">✓ No inclusive-language issues found.</div>';
  return '<div class="notice warn small"><b>Inclusive-language suggestions' + (score !== undefined ? ' · score ' + score + '/100' : '') + '</b><ul style="margin:6px 0;padding-left:18px">' + flags.map(f => '<li><b>' + esc(f.term) + '</b> — ' + esc(f.issue) + '. Try: ' + esc(f.suggestion) + '</li>').join('') + '</ul></div>';
}
function testForm() {
  return '<form data-form="test"><div class="form-row three">' + field('Skill', '<input name="skill" list="bank" required value="AWS">') + field('Level', sel('level', ['Junior', 'Mid', 'Senior', 'Expert'], 'Mid')) + field('Generate', inp('count', 5, 'type="number" min="2" max="15"')) + '</div>' +
    '<datalist id="bank">' + S.db.lists.bankSkills.map(s => '<option value="' + esc(s) + '">').join('') + '</datalist><button class="btn secondary small mt8" type="button" data-action="test-gen">✦ Generate questions</button>' +
    '<div class="form-row three mt16">' + field('Title', inp('title', '', 'required')) + field('Time limit (min)', inp('durationMin', 20, 'type="number" min="5"')) + field('Pass mark (%)', inp('passMark', 70, 'type="number" min="1" max="100"')) + '</div>' +
    '<div id="qs">' + testEditor(S.ui.qs) + '</div><button class="btn ghost small" type="button" data-action="q-add">+ Add question</button><div class="row mt16"><span class="grow"></span><button class="btn">Save assessment</button></div></form>';
}
function collectQs(f) {
  S.ui.qs = (S.ui.qs || []).map((q, i) => ({ q: f['q' + i] ? f['q' + i].value : q.q, options: q.options.map((o, oi) => f['o' + i + '_' + oi] ? f['o' + i + '_' + oi].value : o),
    answer: (() => { const r = f.querySelector('input[name="a' + i + '"]:checked'); return r ? Number(r.value) : q.answer; })() }));
  return S.ui.qs;
}

/* ------------------------------------------------------------------ forms */
const FORMS = {
  'lead': async (v, f, b) => { try { await busy(b, call('submitLead', v)); f.reset(); toast('Thanks! Our team will contact you within one business day.', 'ok', 6000); } catch (e) { fail(e); } },
  'login': async (v, f, b) => { try { const r = await busy(b, call('login', v)); r.pending ? go('#verify?email=' + encodeURIComponent(r.email)) : setSession(r); } catch (e) { fail(e); } },
  'register': async (v, f, b) => { try { const r = await busy(b, call('register', v)); r.pending ? go('#verify?email=' + encodeURIComponent(r.email)) : setSession(r); } catch (e) { fail(e); } },
  'verify': async (v, f, b) => { try { setSession(await busy(b, call('verifyEmail', v))); toast('Welcome to IntelliJobs!', 'ok'); } catch (e) { fail(e); } },
  'forgot': async (v, f, b) => { try { await busy(b, call('requestPasswordCode', v)); toast('If an account exists, a code is on its way.', 'ok'); go('#reset?email=' + encodeURIComponent(v.email)); } catch (e) { fail(e); } },
  'reset': async (v, f, b) => { try { setSession(await busy(b, call('resetPassword', v))); toast('Password saved.', 'ok'); } catch (e) { fail(e); } },
  'create-org': async (v, f, b) => { try { await busy(b, call('createOrganization', v)); closeModal(); S.db = null; go('#app/dashboard'); toast('Organization created.', 'ok'); } catch (e) { fail(e); } },
  'change-password': async (v, f, b) => { try { await busy(b, call('changePassword', v)); closeModal(); toast('Password updated. Other sessions were signed out.', 'ok'); } catch (e) { fail(e); } },
  'preview-fit': async (v, f, b) => { const d = S.ui.job; S.ui.resumeDraft = v.resumeText; try { S.ui.preview = await busy(b, call('previewFit', { slug: d.org.slug, jobId: d.job.id, resumeText: v.resumeText })); paintJob(); } catch (e) { fail(e); } },
  'apply': async (v, f, b) => {
    const d = S.ui.job;
    try {
      const file = await readFile($('apply-file') && $('apply-file').files[0]);
      const answers = (d.job.screeningQuestions || []).map((q, i) => v['answer' + i] || '');
      const r = await busy(b, call('applyToJob', Object.assign({}, v, { slug: d.org.slug, jobId: d.job.id, file: file, answers: answers, consent: !!v.consent })));
      S.ui.applied = r; paintJob(); window.scrollTo(0, 0);
    } catch (e) { fail(e); }
  },
  'task-interview': async (v, f, b) => { const action = b && b.dataset.submit === 'reschedule' ? 'reschedule' : 'confirm'; try { const r = await busy(b, call('respondInterview', { token: S.ui.task.token, action: action, note: v.note })); toast(action === 'confirm' ? 'Confirmed — see you then!' : 'Request sent to the hiring team.', 'ok'); S.ui.task.status = r.status; paintTask(); } catch (e) { fail(e); } },
  'task-screening': async (v, f, b) => { const qs = S.ui.task.questions || []; try { await busy(b, call('submitScreening', { token: S.ui.task.token, answers: qs.map((q, i) => v['a' + i] || '') })); S.ui.task.screeningDone = true; S.ui.task.status = 'Completed'; paintTask(); window.scrollTo(0, 0); } catch (e) { fail(e); } },
  'task-test': async (v, f, b) => { clearInterval(timerHandle); const x = S.ui.test; try { x.result = await busy(b, call('submitAssessment', { token: S.ui.task.token, answers: x.questions.map((q, i) => (v['q' + i] === undefined ? null : Number(v['q' + i]))) })); paintAssessment(); window.scrollTo(0, 0); } catch (e) { fail(e); tickTimer(); } },
  'task-verify': async (v, f, b) => { try { await busy(b, call('respondVerification', { token: S.ui.task.token, consent: !!v.consent, fullName: v.fullName })); toast('Thank you — your authorization was recorded.', 'ok'); renderTask(S.ui.task.token); } catch (e) { fail(e); } },
  'task-offer': async (v, f, b) => { try { await busy(b, call('respondOffer', { token: S.ui.task.token, accept: true, fullName: v.fullName })); toast('Congratulations and welcome aboard!', 'ok', 6000); renderTask(S.ui.task.token); } catch (e) { fail(e); } },
  'job': async (v, f, b) => {
    const qs = String(v.questions || '').split('\n').map(s => s.trim()).filter(Boolean).map(s => ({ q: s.replace(/\s*\*$/, ''), required: !/\*$/.test(s) }));
    const data = Object.assign({}, v, { screeningQuestions: qs, publish: b && b.dataset.submit === 'publish' }); delete data.questions;
    try {
      if (v.id) await busy(b, act(call('updateJob', data), 'Job saved.'));
      else { const r = await busy(b, act(call('createJob', data), r2 => r2.status === 'Open' ? 'Published to your careers page.' : r2.status === 'Pending Approval' ? 'Submitted for approval.' : 'Draft saved.')); go('#app/job/' + r.id); }
    } catch (e) { fail(e); }
  },
  'candidate': async (v, f, b) => {
    try {
      if (v.id) { await busy(b, act(call('updateCandidate', v), 'Candidate saved.')); delete S.cand[v.id]; renderApp(); }
      else { const fe = $('cand-file'); const file = fe && fe.files[0] ? await readFile(fe.files[0]) : null; if (file) v.file = file; const r = await busy(b, act(call('createCandidate', v), 'Candidate added' + (v.jobId ? ' and scored for the job.' : '.'))); go('#app/candidate/' + r.id); }
    } catch (e) { fail(e); }
  },
  'note': async (v, f, b) => { try { await busy(b, call('addNote', v)); delete S.cand[v.candidateId]; renderApp(); toast('Note added.', 'ok'); } catch (e) { fail(e); } },
  'message': async (v, f, b) => { try { const r = await busy(b, act(call('sendCandidateMessage', v), r2 => 'Message ' + r2.status.toLowerCase() + '.')); delete S.cand[v.candidateId]; } catch (e) { fail(e); } },
  'add-to-job': async (v, f, b) => { try { await busy(b, act(call('addToJob', v), r => 'Added · fit ' + r.fit + '%.')); } catch (e) { fail(e); } },
  'import': async (v, f, b) => { try { const file = $('csv-file') && $('csv-file').files[0]; const csv = file ? await file.text() : v.csv; const r = await busy(b, act(call('importCandidates', csv), r2 => r2.added + ' candidate(s) imported' + (r2.skipped.length ? ', ' + r2.skipped.length + ' skipped' : '') + '.')); if (r.skipped.length) openModal('Skipped rows', '<ul class="small">' + r.skipped.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>'); } catch (e) { fail(e); } },
  'schedule': async (v, f, b) => { const data = Object.assign({}, v, { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }); if (v.startsAt) data.startsAt = new Date(v.startsAt).toISOString(); if (v.mode === 'AI-assisted screening') delete data.startsAt; try { const r = await busy(b, act(call('scheduleInterview', data), null)); linkModal('Interview scheduled', r.link, r.mail); } catch (e) { fail(e); } },
  'resched': async (v, f, b) => { try { await busy(b, act(call('updateInterview', { id: v.id, startsAt: new Date(v.startsAt).toISOString(), meetingLink: v.meetingLink, notify: !!v.notify }), r => 'Rescheduled.' + mailNote(r.mail))); } catch (e) { fail(e); } },
  'scorecard': async (v, f, b) => { const ratings = {}; S.db.lists.competencies.forEach(k => { if (v['r_' + k]) ratings[k] = v['r_' + k]; }); try { await busy(b, act(call('submitScorecard', { interviewId: v.interviewId, ratings: ratings, overall: v.overall, recommendation: v.recommendation, notes: v.notes }), 'Scorecard submitted.')); } catch (e) { fail(e); } },
  'test': async (v, f, b) => { const qs = collectQs(f); try { await busy(b, act(call('createAssessment', { title: v.title, skill: v.skill, level: v.level, durationMin: v.durationMin, passMark: v.passMark, questions: qs }), 'Assessment saved.')); S.ui.qs = []; } catch (e) { fail(e); } },
  'send-test': async (v, f, b) => { try { const r = await busy(b, act(call('inviteToAssessment', v), null)); linkModal('Assessment sent', r.link, r.mail); } catch (e) { fail(e); } },
  'verify-req': async (v, f, b) => { try { const r = await busy(b, act(call('requestVerification', { applicationId: v.applicationId, checks: v.checks || [], provider: v.provider, notes: v.notes }), null)); linkModal('Consent request sent', r.link, r.mail); } catch (e) { fail(e); } },
  'ver-result': async (v, f, b) => { try { await busy(b, act(call('updateVerification', { id: v.id, providerRef: v.providerRef, result: v.result, notes: v.notes, status: 'Completed' }), v.result === 'Consider' ? 'Recorded. Review individually before any pre-adverse notice.' : 'Result recorded.')); } catch (e) { fail(e); } },
  'pre-adverse': async (v, f, b) => { try { await busy(b, act(call('sendPreAdverse', v), r => 'Pre-adverse notice recorded. Earliest final decision: ' + r.earliestFinal + '.' + mailNote(r.mail))); } catch (e) { fail(e); } },
  'offer': async (v, f, b) => { try { await busy(b, act(call('createOffer', v), r => r.status === 'Approved' ? 'Offer approved — send it when ready.' : 'Offer sent for approval.')); } catch (e) { fail(e); } },
  'plan': async (v, f, b) => { try { const r = await busy(b, act(call('createSkillPlan', v), r2 => 'Plan created for ' + (r2.gaps.length ? r2.gaps.join(', ') : 'proving existing skills') + '.' + mailNote(r2.mail))); } catch (e) { fail(e); } },
  'copilot': async (v, f, b) => { S.ui.chat.push({ who: 'me', text: v.question }); renderApp(); try { const r = await call('aiCopilot', { question: v.question }); S.ui.chat.push({ who: 'ai', text: r.answer, provider: r.provider }); } catch (e) { S.ui.chat.push({ who: 'ai', text: e.message }); } renderApp(); S.ui.refocus = 'cp-q'; afterPaint('copilot'); },
  'tool-parse': async (v, f, b) => { try { const file = await readFile($('tp-file') && $('tp-file').files[0]); let text = v.text; if (file) text = (await call('extractResumeText', file)).text; const r = await busy(b, call('aiParseResume', { text: text })); $('tp-out').innerHTML = '<div class="card flat mt16"><b>' + esc(r.name || '(name not detected)') + '</b> · ' + esc(r.headline) + '<div class="small muted">' + esc(r.email) + ' ' + esc(r.phone) + ' · ' + (r.years || '?') + ' years</div><div class="mt8">' + chips(r.skills, 'a') + '</div><div class="tiny dim mt8">' + esc(r.provider) + '</div></div>'; } catch (e) { fail(e); } },
  'tool-inclusive': async (v, f, b) => { try { const r = await busy(b, call('aiInclusiveReview', v)); $('ti-out').innerHTML = inclusiveHtml(r.flags, r.score); } catch (e) { fail(e); } },
  'invite': async (v, f, b) => { try { await busy(b, act(call('addMember', v), r => r.invited ? (r.emailed ? 'Invitation emailed.' : 'Member added — the invitation email could not be sent; they can use "Accept an invite".') : 'Member added.')); } catch (e) { fail(e); } },
  'careers': async (v, f, b) => { try { await busy(b, act(call('updateCareersSettings', { slug: v.slug, headline: v.headline, about: v.about, color: v.color, enabled: !!v.enabled }), 'Careers site saved.')); } catch (e) { fail(e); } },
  'invoice': async (v, f, b) => { try { await busy(b, act(call('requestInvoice', v), 'Invoice requested — our team will be in touch.', { refresh: false })); S.billing = null; renderApp(); } catch (e) { fail(e); } },
  'plat-settings': async (v, f, b) => { try { await busy(b, call('platformSaveSettings', v)); toast('Settings saved.', 'ok'); S.plat = null; S.pub = null; renderApp(); } catch (e) { fail(e); } },
  'plat-secret': async (v, f, b) => { try { await busy(b, call('platformSetSecret', v)); toast(v.value ? 'Secret saved.' : 'Secret removed.', 'ok'); S.plat = null; renderApp(); } catch (e) { fail(e); } },
  'plat-org': async (v, f, b) => { try { await busy(b, call('platformUpdateOrg', v)); closeModal(); toast('Organization updated.', 'ok'); S.plat = null; renderApp(); } catch (e) { fail(e); } }
};

/* ------------------------------------------------------------------ change handlers */
const CHANGES = {
  'switch-org': async v => { try { await call('switchOrg', v); S.db = null; S.billing = null; S.reports = null; S.audit = null; route(); } catch (e) { fail(e); } },
  'stage': (v, el) => {
    const id = el.dataset.id;
    if (v === 'Rejected') return openModal('Reject application', '<form data-form="reject"><input type="hidden" name="applicationId" value="' + id + '">' + field('Job-related reason (required)', sel('reason', S.db.lists.rejectReasons, '')) + '<label class="check mt16"><input type="checkbox" name="notify" checked> <span>Send a respectful decline email</span></label><button class="btn danger mt16">Reject</button></form>');
    moveTo(id, v);
  },
  'rate': async (v, el) => { if (!v) return; try { await call('rateApplication', { applicationId: el.dataset.id, rating: v }); toast('Rated.', 'ok'); const a = appById(el.dataset.id); a.rating = Number(v); } catch (e) { fail(e); } },
  'pipe-job': v => { S.ui.pipeJob = v; renderApp(); },
  'careers-wt': v => { S.ui.wt = v; paintCareers(); },
  'iv-status': async (v, el) => { if (!v) return; try { await act(call('updateInterview', { id: el.dataset.id, status: v }), 'Interview marked ' + v.toLowerCase() + '.'); } catch (e) { fail(e); } },
  'iv-mode': v => { const w = $('iv-when'), h = $('iv-hint'); if (w) w.style.display = v === 'AI-assisted screening' ? 'none' : ''; if (h) h.textContent = v === 'AI-assisted screening' ? 'The candidate gets structured, job-related written questions to answer any time in the next 14 days, with an AI disclosure and accommodation path. You get a summary for human review.' : 'The candidate gets an email with a calendar invite and a private link to confirm or request another time.'; },
  'member-role': async (v, el) => { const m = S.db.members.find(x => x.id === el.dataset.id); try { await act(call('updateMember', { id: m.id, role: v, status: m.status }), 'Role updated.'); } catch (e) { fail(e); renderApp(); } },
  'lead-status': async (v, el) => { try { await call('platformUpdateLead', { id: el.dataset.id, status: v }); toast('Lead updated.', 'ok'); } catch (e) { fail(e); } },
  'cand-file': async (v, el) => {
    try {
      const file = await readFile(el.files[0]); if (!file) return;
      toast('Reading resume…');
      const r = await call('extractResumeText', file), f = el.form, p = r.parsed;
      f.resumeText.value = r.text;
      [['name', p.name], ['email', p.email], ['phone', p.phone], ['headline', p.headline], ['yearsExp', p.years || ''], ['skills', (p.skills || []).join(', ')], ['linkedin', p.linkedin]].forEach(x => { if (x[1] && !f[x[0]].value) f[x[0]].value = x[1]; });
      toast('Profile extracted — review and save.', 'ok');
    } catch (e) { fail(e); }
  }
};
FORMS.reject = async (v, f, b) => { try { await busy(b, act(call('moveStage', { applicationId: v.applicationId, stage: 'Rejected', reason: v.reason, notify: !!v.notify }), r => 'Rejected.' + mailNote(r.mail))); } catch (e) { fail(e); } };
async function moveTo(id, stage) {
  try { await act(call('moveStage', { applicationId: id, stage: stage }), 'Moved to ' + stage + '.'); }
  catch (e) { fail(e); renderApp(); }
}

/* ------------------------------------------------------------------ wiring */
function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const fn = ACTIONS[el.dataset.action]; if (!fn) return;
    if (el.dataset.action !== 'modal-bg') e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const h = FORMS[f.dataset.form]; if (h) h(formValues(f), f, e.submitter || f.querySelector('button[type=submit],button:not([type])'));
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]'); if (!el) return;
    const h = CHANGES[el.dataset.change]; if (h) h(el.value, el, e);
  });
  let deb = null;
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-filter]'); if (!el) return;
    clearTimeout(deb);
    deb = setTimeout(() => {
      if (el.dataset.filter === 'careers') { S.ui.q = el.value; paintCareers(); S.ui.refocus = 'careers-q'; afterPaint(''); }
      if (el.dataset.filter === 'cand') { S.ui.candQ = el.value; S.ui.refocus = 'cand-q'; renderApp(); }
    }, 180);
  });
  let dragId = null;
  document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-app]'); if (c) { dragId = c.dataset.app; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { /* IE */ } } });
  document.addEventListener('dragover', e => { const l = e.target.closest && e.target.closest('[data-lane]'); if (l && dragId) { e.preventDefault(); document.querySelectorAll('.lane.drop').forEach(x => x !== l && x.classList.remove('drop')); l.classList.add('drop'); } });
  document.addEventListener('dragleave', e => { const l = e.target.closest && e.target.closest('[data-lane]'); if (l && !l.contains(e.relatedTarget)) l.classList.remove('drop'); });
  document.addEventListener('drop', e => {
    const l = e.target.closest && e.target.closest('[data-lane]'); if (!l || !dragId) return;
    e.preventDefault(); l.classList.remove('drop');
    const a = appById(dragId), id = dragId; dragId = null;
    if (a.stage !== l.dataset.lane) CHANGES.stage(l.dataset.lane, { dataset: { id: id } });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
  window.addEventListener('hashchange', route);
}

bind();
route();
</script>
